name: frequency
version: 1

required_columns:
  - Policy_ID
  - Product
  - Region
  - Age_Group
  - Exposure
  - Claim
  - Expected_Frequency
  - Year
  - Month

optional_columns:
  - Plan_Type
  - Distribution_Channel
  - Gender
  - Customer_ID
  - Quarter

column_types:
  Policy_ID: string
  Product: string
  Region: string
  Age_Group: string
  Exposure: float
  Claim: integer
  Expected_Frequency: float
  Year: integer
  Month: integer
  Plan_Type: string
  Distribution_Channel: string
  Gender: string
  Customer_ID: string
  Quarter: string

numeric_constraints:
  Exposure:
    min: 0
  Claim:
    min: 0
    max: 1
  Expected_Frequency:
    min: 0
    max: 1
  Year:
    min: 2000
    max: 2100
  Month:
    min: 1
    max: 12
