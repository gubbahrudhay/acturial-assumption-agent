name: combined
version: 1

required_columns:
  - Policy_ID
  - Product
  - Region
  - Age_Group
  - Exposure
  - Claim
  - Expected_Frequency
  - Actual_Claim_Amount
  - Expected_Severity
  - Year
  - Month

optional_columns:
  - Plan_Type
  - Distribution_Channel
  - Gender
  - Customer_ID
  - Quarter
  - Claim_ID
  - Claim_Date
  - Claim_Category
  - Hospital_Type
  - Claim_Status

column_types:
  Policy_ID: string
  Product: string
  Region: string
  Age_Group: string
  Exposure: float
  Claim: integer
  Expected_Frequency: float
  Actual_Claim_Amount: float
  Expected_Severity: float
  Year: integer
  Month: integer
  Plan_Type: string
  Distribution_Channel: string
  Gender: string
  Customer_ID: string
  Quarter: string
  Claim_ID: string
  Claim_Date: date
  Claim_Category: string
  Hospital_Type: string
  Claim_Status: string

numeric_constraints:
  Exposure:
    min: 0
  Claim:
    min: 0
    max: 1
  Expected_Frequency:
    min: 0
    max: 1
  Actual_Claim_Amount:
    min: 0
  Expected_Severity:
    min: 0
  Year:
    min: 2000
    max: 2100
  Month:
    min: 1
    max: 12
